/* FITTRACK PRO: movement library and midnight-violet training UI */
:root { --bg:#0b0b17; --surface:#141428; --surface2:#1c1b36; --surface3:#292746; --border:#30304d; --text:#f7f5ff; --muted:#aaa9c5; --accent:#a78bfa; --accent-dark:#30234e; --violet:#bda9ff; --blue:#8ba8ff; --danger:#ff8b9d; }
body {background:radial-gradient(ellipse at 80% -20%,#242049 0,transparent 46%),var(--bg)}
.sidebar {background:#101022;border-color:#2e2b4c}
.brand-mark {background:linear-gradient(135deg,#8c5af8,#bc9aff);color:white;box-shadow:0 6px 22px #7b4ce856}
.nav-item.active,.nav-item:hover {background:#211c3c}
.topbar {background:#111126e6;border-color:#2e2b4c}
.storage-chip {color:#a8e8b9}
.btn:not(.ghost):not(.secondary):not(.danger) {background:linear-gradient(110deg,#8054eb,#a377f8);color:white;box-shadow:0 7px 24px #6336d42e}
.btn:not(.ghost):not(.secondary):not(.danger):hover {filter:brightness(1.1)}
.btn.secondary {background:#2d2448;color:#e4d6ff;border-color:#48355c}
input,select,textarea {background:#111224;border-color:#393453}
input:focus,select:focus,textarea:focus {border-color:#9c78f9;box-shadow:0 0 0 2px #a98aff30}
.hero {background:linear-gradient(120deg,#272046,#17162b 70%);border-color:#4b3d74}
.hero:after {opacity:.12;filter:hue-rotate(58deg)}
.panel,.exercise-card {background:#151527;border-color:#31304d}
.session-prep {background:#16152b}
.bottom-nav{background:#131223f5}
.bottom-nav button.active {background:#9c78f91a}
.progress-bar>div{background:linear-gradient(90deg,#8055ec,#b59fff)}
.week-day.today {border-color:#926df7}
.pill.green{background:#133729;color:#a9f4c4}
.set-row.complete {background:#212440}
.complete-set.yes {background:#9b79ff;color:white}
.set-note {background:#24213c;border-color:#453566}
.guide-button {white-space:normal;text-align:center}
.quick-settings {background:#241e3c;border:1px solid #3b305a;border-radius:10px;color:#c5b1ff;font-size:18px;min-width:36px;height:36px;display:grid;place-items:center}
.guide-intro {display:flex;gap:16px;align-items:center;margin-bottom:16px;background:linear-gradient(110deg,#251b46,#151728)}

.exercise-guide-cta .btn{font-size:11px;padding:9px 12px}
.back-link {border:0;background:transparent;color:#c1adfc;font-size:13px;font-weight:700;padding:0;margin-bottom:19px}
.back-link:hover {text-decoration:underline}
.guide-page {max-width:1060px;margin:0 auto;padding-bottom:40px}
.guide-heading {margin-bottom:20px}
.guide-heading h1 {font-size:clamp(26px,4vw,41px);line-height:1.15;letter-spacing:-1px;margin:9px 0}
.guide-heading p {color:#aba8c7;margin:0}
.pose-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.pose-grid figure {margin:0;overflow:hidden;border-radius:16px;border:1px solid #3c345f;background:#1b1a34}

.pose-grid figcaption {border-top:1px solid #302d50;text-align:center;padding:11px;font-size:10px;letter-spacing:1.2px;font-weight:800;color:#c7b3ff}
.guide-warning-inline{margin:11px 0 20px;font-size:11px;line-height:1.6;color:#a9a7c2}

.guide-main,.guide-aside{display:flex;flex-direction:column;gap:14px}
.guide-panel {padding:22px 23px}

.guide-previous {font-weight:800;color:#eee8ff!important}

.brief-panel p{font-size:12px;line-height:1.6;color:#b4aecb;margin-bottom:0}

:root{--bg:#0c0b16;--surface:#151321;--surface2:#1e1a31;--surface3:#292441;--border:#34304b;--text:#f7f4ff;--muted:#b1a9c6;--accent:#9a66ff;--accent-dark:#39265f;--violet:#b99bff;--blue:#c5aeff}

.movement-loop .motion-start{animation:motionStart 2.3s steps(1,end) infinite}

function validateState(value){if(!value||!Array.isArray(value.plan)||!Array.isArray(value.history)||value.version!==1)throw Error('Invalid or unsupported backup');for(const p of value.plan){if(typeof p.id!=='string'||typeof p.name!=='string'||!Array.isArray(p.exercises))throw Error('Invalid plan data');for(const ex of p.exercises){if(typeof ex.id!=='string'||typeof ex.name!=='string')throw Error('Invalid exercise');}}return {...emptyState(),...value,checklists:value.checklists||{},mobility:value.mobility||{},videoLinks:value.videoLinks||{},settings:{...emptyState().settings,...value.settings}};}
async function persistNow(){try{if(ui.storageMode==='indexeddb'&&db){const serialized=JSON.stringify(state);await new Promise((resolve,reject)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(serialized,'state');tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});}else if(ui.storageMode==='localStorage'){localStorage.setItem('fittrack-state-v1',JSON.stringify(state));}}catch(e){console.warn('Could not save:',e);ui.storageMode='memory';toast('Saving is unavailable. Please export your data.',true);}}
function queueSave(){clearTimeout(ui.saveTimer);ui.saveTimer=setTimeout(()=>persistNow(),250);}
function immediateSave(){clearTimeout(ui.saveTimer);return persistNow();}
function toast(msg,warning=false){const el=$('#toast');el.textContent=msg;el.style.background=warning?'#ffe4b8':'';el.style.color=warning?'#4b2d08':'';el.classList.add('show');clearTimeout(ui.toastTimeout);ui.toastTimeout=setTimeout(()=>{el.classList.remove('show');el.style.background='';el.style.color='';},3000);}
function go(view){ui.view=view;history.replaceState(null,'',`#${view}`);render();window.scrollTo({top:0,behavior:'instant'});}
function todayCompleted(){const id=todayPlan();return id?state.history.some(h=>h.date===localDate()&&h.planId===id):false;}
function getLastSets(exerciseId){for(let i=state.history.length-1;i>=0;i--){const h=state.history[i];const sets=(h.sets||[]).filter(s=>s.exerciseId===exerciseId && s.type!=='warmup');if(sets.length)return sets;}return [];}
function getBestWeight(exId){const a=getLastSets(exId);return a.length?num(a[0].weight):0;}
function totalDone(draft=state.draft){if(!draft)return 0;return draft.exercises.reduce((n,ex)=>n+working(ex.sets).length,0);}
function totalPlanned(draft=state.draft){return draft?draft.exercises.reduce((n,ex)=>n+(ex.optional?0:ex.sets.filter(s=>s.type==='working').length),0):0;}
function workoutDoneDays(){const key=new Set(state.history.map(h=>h.date));return key;}
function stats(){const total=state.history.length;const week=state.history.filter(h=>isInWeek(h.date)).length;const allSets=state.history.reduce((n,h)=>n+(h.sets||[]).filter(s=>s.type!=='warmup').length,0);const volume=Math.round(state.history.reduce((sum,h)=>sum+(h.sets||[]).reduce((acc,s)=>acc+(s.type!=='warmup'?num(s.weight)*num(s.reps):0),0),0));return {total,week,allSets,volume};}

function embedUrl(url){
 try{const u=new URL(url); if(u.protocol!=='https:')return '';
 const h=u.hostname.toLowerCase().replace(/^www\./,'');
 if(h==='youtube.com'||h==='m.youtube.com'){const id=u.pathname.startsWith('/shorts/')?u.pathname.split('/')[2]:u.searchParams.get('v');const raw=u.searchParams.get('t')||u.searchParams.get('start')||'';const time=/^(\d+)s?$/.test(raw)?Number(raw.replace('s','')):0;return /^[\w-]{11}$/.test(id||'')?'https://www.youtube-nocookie.com/embed/'+id+'?rel=0'+(time?'&start='+time:''):'';}
 if(h==='youtu.be'){const id=u.pathname.slice(1).split('/')[0];return /^[\w-]{11}$/.test(id)?'https://www.youtube-nocookie.com/embed/'+id+'?rel=0':'';}
 if(h==='vimeo.com'){const m=u.pathname.match(/^\/(\d+)(?:\/|$)/);return m?'https://player.vimeo.com/video/'+m[1]:'';}
 }catch{}return '';
}

function finishWorkout(){const d=state.draft;if(!d)return;const all=d.exercises.flatMap(ex=>ex.sets.filter(s=>s.done).map(s=>({...s,exerciseId:ex.exerciseId,name:ex.name,group:ex.group,unit:ex.unit})));const strength=all.filter(s=>s.type!=='warmup');if(!strength.length){toast('Complete at least one working set before finishing.',true);return;}const incomplete=d.exercises.reduce((n,ex)=>n+ex.sets.filter(s=>!s.done&&s.type==='working'&&!ex.optional).length,0);if(incomplete && !confirm(`${incomplete} planned working sets are unfinished. Save this workout anyway?`))return;const endedAt=new Date().toISOString();state.history.push({id:d.id,planId:d.planId,name:d.name,date:localDate(),startedAt:d.startedAt,endedAt,durationSec:Math.round((Date.now()-new Date(d.startedAt).getTime())/1000),sets:all,notes:d.notes||''});state.draft=null;stopRest();immediateSave();go('progress');toast(`Saved ${strength.length} working sets. Strong work!`);}
function timerBeep(){try{const AudioCtx=window.AudioContext||window.webkitAudioContext;if(AudioCtx){const context=new AudioCtx();const osc=context.createOscillator(),gain=context.createGain();osc.connect(gain);gain.connect(context.destination);osc.frequency.setValueAtTime(880,context.currentTime);gain.gain.setValueAtTime(0.04,context.currentTime);gain.gain.exponentialRampToValueAtTime(.001,context.currentTime+.16);osc.start();osc.stop(context.currentTime+.17);osc.onended=()=>context.close();}if(navigator.vibrate)navigator.vibrate([100,60,100]);}catch{}}
function startRest(sec){ui.restEnd=Date.now()+Math.max(5,num(sec,90))*1000;clearInterval(ui.restInterval);ui.restInterval=setInterval(()=>{renderTimer();const c=$('#elapsedClock');if(c&&state.draft)c.textContent=formatTime((Date.now()-new Date(state.draft.startedAt).getTime())/1000);},1000);renderTimer();}
function stopRest(){ui.restEnd=0;clearInterval(ui.restInterval);ui.restInterval=null;renderTimer();}
function renderTimer(){const el=$('#restTimer');if(!el)return;if(!ui.restEnd){el.classList.add('hidden');return;}const rem=Math.ceil((ui.restEnd-Date.now())/1000);if(rem<=0){stopRest();timerBeep();toast('Rest complete — ready for your next set!');return;}el.classList.remove('hidden');el.innerHTML=`<span class="muted tiny">REST TIMER</span><strong>${formatTime(rem)}</strong><button class="btn small secondary" data-action="add-rest">+30s</button><button class="close" data-action="stop-rest" title="Skip rest">✕</button>`;}
function setDone(exIndex,setIndex){const ex=state.draft?.exercises[exIndex];const s=ex?.sets[setIndex];if(!s)return;if(!s.done && (!Number.isFinite(Number(s.reps))||num(s.reps)<=0)){toast(`Enter ${ex.unit==='sec'?'seconds':'reps'} before completing this set.`,true);return;}if(!s.done && (!Number.isFinite(Number(s.weight))||num(s.weight)<0)){toast('Enter a valid non-negative weight.',true);return;}s.done=!s.done;s.completedAt=s.done?new Date().toISOString():undefined;queueSave();render();if(s.done && state.settings.autoRest)startRest(ex.rest);}
function setType(exIndex,setIndex){const s=state.draft?.exercises[exIndex]?.sets[setIndex];if(!s)return;s.type=({working:'warmup',warmup:'drop',drop:'working'})[s.type]||'working';queueSave();render();}
function addSet(exIndex,type){const ex=state.draft?.exercises[exIndex];if(!ex)return;const last=ex.sets.at(-1);const weight=type==='drop'?Math.max(0,+(num(last?.weight)*.75).toFixed(1)):num(last?.weight);ex.sets.push({id:uid(),type,weight,reps:'',rir:type==='warmup'?4:2,done:false});queueSave();render();const card=$(`#exercise-${exIndex}`);card?.scrollIntoView({block:'center'});}
function removeSet(exIndex){const ex=state.draft?.exercises[exIndex];if(!ex||ex.sets.length<=1){toast('At least one set must remain.',true);return;}const s=ex.sets.at(-1);if(s.done&&!confirm('Remove the last completed set?'))return;ex.sets.pop();queueSave();render();}
function barChart(weekly){const w=640,h=240,left=30,top=20,bottom=198,chartH=bottom-top;const max=Math.max(3,...weekly.map(x=>x.count));return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Weekly completed workouts chart">${[0,1,2,3].map(i=>{const yy=bottom-i/3*chartH;return `<line x1="${left}" y1="${yy}" x2="620" y2="${yy}" stroke="#344247" stroke-dasharray="3 6"/><text x="22" y="${yy+4}" fill="#81918a" font-size="10" text-anchor="end">${Math.round(max*i/3)}</text>`;}).join('')}${weekly.map((v,i)=>{const bw=42;const x=left+16+i*74;const hh=v.count/max*(chartH-8);return `<rect x="${x}" y="${bottom-hh}" width="${bw}" height="${hh||2}" rx="7" fill="${i===weekly.length-1?'#a68aff':'#625291'}"/><text x="${x+bw/2}" y="${bottom+20}" fill="#aaa2c5" font-size="10" text-anchor="middle">${esc(v.label)}</text>${v.count?`<text x="${x+bw/2}" y="${bottom-hh-9}" fill="#e8f4e6" font-size="11" text-anchor="middle">${v.count}</text>`:''}`;}).join('')}</svg>`;}
function lineChart(data){const w=640,h=230,left=40,right=612,top=24,bottom=180;if(!data.length)return '<div class="empty"><strong>No history yet</strong>Log this exercise in a finished workout to see your trend.</div>';const vals=data.map(x=>x.value);let lo=Math.min(...vals),hi=Math.max(...vals);if(lo===hi){lo=Math.max(0,lo-5);hi+=5;}const xy=data.map((d,i)=>({x:data.length===1?(left+right)/2:left+(right-left)*i/(data.length-1),y:bottom-(d.value-lo)/(hi-lo)*(bottom-top)}));const path=xy.map((p,i)=>`${i===0?'M':'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Estimated exercise strength trend">${[0,1,2,3].map(i=>{const y=bottom-(bottom-top)*i/3;return `<line x1="${left}" y1="${y}" x2="${right}" y2="${y}" stroke="#354144" stroke-dasharray="4 5"/><text x="${left-8}" y="${y+4}" text-anchor="end" fill="#96a8a0" font-size="10">${(lo+(hi-lo)*i/3).toFixed(0)}</text>`;}).join('')}<path d="${path}" fill="none" stroke="#a68aff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>${xy.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="5" fill="#a68aff" stroke="#17221c" stroke-width="2"/><text x="${p.x}" y="${p.y-13}" fill="#e6dcff" text-anchor="middle" font-size="10">${data[i].value.toFixed(1)}</text>`).join('')}<text x="${left}" y="${bottom+30}" fill="#91a198" font-size="11">${esc(data[0].label)}</text><text x="${right}" y="${bottom+30}" text-anchor="end" fill="#91a198" font-size="11">${esc(data.at(-1).label)}</text></svg>`;}
function renderProgress(){const s=stats();const base=monday();const weekly=Array.from({length:8},(_,i)=>{const start=dateShift(base,(i-7)*7);const end=dateShift(start,6);return {label:start.toLocaleDateString(undefined,{month:'short',day:'numeric'}),count:state.history.filter(h=>h.date>=localDate(start)&&h.date<=localDate(end)).length};});const available=new Map();state.plan.forEach(p=>p.exercises.forEach(ex=>available.set(ex.id,ex.name)));state.history.forEach(h=>h.sets.forEach(s=>available.set(s.exerciseId,s.name)));const opts=Array.from(available.entries()).sort((a,b)=>a[1].localeCompare(b[1]));if(!available.has(ui.trendExercise))ui.trendExercise=opts[0]?.[0]||'';const trend=state.history.map(h=>{const group=h.sets.filter(s=>s.exerciseId===ui.trendExercise && s.type!=='warmup' && num(s.reps)>0 && num(s.reps)<=30);if(!group.length)return null;return {label:datePrettyKey(h.date),value:Math.max(...group.map(s=>num(s.weight)*(1+num(s.reps)/30)))};}).filter(Boolean).slice(-12);
const byGroup={};state.history.forEach(h=>{if(!isInWeek(h.date))return;h.sets.forEach(s=>{if(s.type==='warmup')return;byGroup[s.group]=(byGroup[s.group]||0)+1;});});const maxSets=Math.max(1,...Object.values(byGroup));
return `${head('TRAINING ANALYTICS','Progress that you can see.','Your workout logs power these charts. No remote service receives the data.')}<div class="grid four-col" style="margin-bottom:16px"><div class="panel stat"><div class="stat-title">ALL WORKOUTS</div><div class="stat-value">${s.total}</div><div class="stat-foot">Completed sessions</div></div><div class="panel stat"><div class="stat-title">THIS WEEK</div><div class="stat-value">${s.week} <span class="muted">/ 6</span></div><div class="stat-foot">Sessions logged</div></div><div class="panel stat"><div class="stat-title">WORKING SETS</div><div class="stat-value">${s.allSets}</div><div class="stat-foot">Including drop sets</div></div><div class="panel stat"><div class="stat-title">TOTAL VOLUME</div><div class="stat-value">${s.volume.toLocaleString()}</div><div class="stat-foot">kg × reps (not bodyweight)</div></div></div><div class="grid two-col"><div><div class="panel"><div class="panel-header"><div><h3>Workout consistency</h3><p>Completed sessions per week · last 8 weeks</p></div></div>${barChart(weekly)}</div><div class="panel" style="margin-top:16px"><div class="panel-header"><div><h3>Exercise strength trend</h3><p>Estimated 1RM = load × (1 + reps / 30)</p></div></div><select aria-label="Choose an exercise for strength chart" data-action="trend-exercise" style="width:100%;margin-bottom:14px">${opts.map(([id,name])=>`<option value="${esc(id)}" ${id===ui.trendExercise?'selected':''}>${esc(name)}</option>`).join('')}</select>${lineChart(trend)}<p class="muted-note">Estimated 1RM is only a rough trend, especially for machines and isolation movements. Never attempt a true 1-rep max to fill this chart.</p></div></div><div><div class="panel"><div class="panel-header"><div><h3>Weekly sets by muscle focus</h3><p>Direct working sets, not indirect overlap</p></div></div>${Object.keys(byGroup).length?Object.entries(byGroup).sort((a,b)=>b[1]-a[1]).map(([name,value])=>`<div class="volume-row"><strong style="min-width:78px">${esc(name)}</strong><div class="meter"><div style="width:${value/maxSets*100}%"></div></div><strong>${value}</strong></div>`).join(''):'<div class="empty">Complete your first session to see weekly muscle-group coverage.</div>'}<p class="muted-note">Compound lifts also train other muscles; these categories are simplified for tracking.</p></div><div class="panel" style="margin-top:16px"><div class="panel-header"><div><h3>Workout history</h3><p>${state.history.length} finished sessions</p></div></div>${state.history.length?state.history.slice().reverse().map(h=>{const volume=Math.round(h.sets.reduce((n,s)=>n+(s.type==='warmup'?0:num(s.weight)*num(s.reps)),0));return `<details class="history-item"><summary><div><strong>${esc(h.name)}</strong><small>${esc(datePrettyKey(h.date))} · ${h.sets.filter(s=>s.type!=='warmup').length} sets · ${Math.round((h.durationSec||0)/60)} min</small></div><span class="pill">${volume.toLocaleString()} kg</span></summary><div class="history-rows">${h.sets.map(s=>`<div><span>${esc(s.name)} <span class="muted">(${esc(s.type||'working')})</span></span><strong>${num(s.weight)} kg × ${num(s.reps)} ${s.unit==='sec'?'sec':'reps'} · ${num(s.rir,2)} RIR</strong></div>`).join('')}</div>${h.notes?`<p class="muted small">Notes: ${esc(h.notes)}</p>`:''}<div class="btn-row" style="margin-top:10px"><button class="btn danger small" data-action="delete-history" data-history="${esc(h.id)}">Delete workout</button></div></details>`;}).join(''):'<div class="empty"><strong>Nothing logged yet</strong>Start a workout and complete a set, then finish your session. It will appear here.</div>'}</div></div></div>`;}
function renderSettings(){return `${head('YOUR DATA','Make the tracker yours.','No login. No subscription. Your history is stored in this browser.')}<div class="grid two-col"><div><div class="panel setting-section"><div class="setting-title"><div><h3>Keep your workout history safe</h3><p>Export and restore your entire plan, logs and preferences</p></div>${pill('Offline','green')}</div><div class="btn-row"><button class="btn" data-action="export-data">↓ Export JSON backup</button><button class="btn secondary" data-action="import-data">↑ Restore backup</button></div><p class="muted-note">Backup files are saved to your downloads. Restoring replaces all current data. Store a copy in your phone files or personal cloud drive.</p></div><div class="panel setting-section"><div class="setting-title"><div><h3>Install as a phone app</h3><p>Works from your home screen when hosted on HTTPS</p></div></div><div class="btn-row"><button class="btn secondary" data-action="install-pwa" id="installBtn">↗ Install FitTrack</button></div><p class="muted-note">Android Chrome: open the hosted website → menu (⋮) → Add to Home screen / Install app. iPhone Safari: Share → Add to Home Screen. Installation options depend on browser and hosting.</p></div><div class="panel setting-section"><div class="setting-title"><div><h3>Browser storage</h3><p id="storageStatus">${ui.storageMode==='indexeddb'?'IndexedDB ready — private to this browser origin':ui.storageMode==='localStorage'?'Using basic browser storage':'Storage unavailable — export data now'}</p></div><button class="btn secondary" data-action="persistent-storage">Request durable storage</button><p class="muted-note">Browsers may still delete site data, and changing browsers/devices does not transfer workouts. Export backups regularly.</p></div></div><div><div class="panel setting-section"><div class="setting-title"><div><h3>Workout preferences</h3><p>Customize your logging experience</p></div></div><label class="checkbox-row"><input type="chec function exerciseModal(index=null){const p=getPlan(ui.selectedPlan);if(!p)return;const editing=index!==null;const ex=editing?p.exercises[index]:E('','Back',3,8,12,90,'');if(!ex)return;const groups=['Chest','Back','Triceps','Biceps','Forearms','Quads','Hamstrings','Glutes','Adductors','Calves','Shoulders','Traps','Core','Other'];modalOpen(`<div class="eyebrow">${editing?'EDIT EXERCISE':'NEW EXERCISE'}</div><h2>${editing?'Update your movement':'Add to '+esc(p.short)}</h2><p>Changes to your program affect future sessions only.</p><form id="exerciseForm" data-index="${editing?index:''}"><div class="field"><label for="exName">Exercise name</label><input id="exName" name="name" maxlength="90" value="${esc(ex.name)}" required/></div><div class="fields-row"><div class="field"><label for="exGroup">Muscle group</label><select name="group" id="exGroup">${groups.map(g=>`<option value="${g}" ${g===ex.group?'selected':''}>${g}</option>`).join('')}</select></div><div class="field"><label for="exSets">Working sets</label><input id="exSets" type="number" name="sets" min="1" max="12" value="${num(ex.sets)}" required/></div></div><div class="fields-row"><div class="field"><label for="exMin">Minimum reps / seconds</label><input id="exMin" type="number" name="min" min="1" max="300" value="${num(ex.min)}" required/></div><div class="field"><label for="exMax">Maximum reps / seconds</label><input id="exMax" type="number" name="max" min="1" max="300" value="${num(ex.max)}" required/></div></div><div class="fields-row"><div class="field"><label for="exRest">Rest seconds</label><input id="exRest" type="number" name="rest" min="0" max="600" step="5" value="${num(ex.rest)}" required/></div><div class="field"><label for="exUnit">Reps or seconds</label><select id="exUnit" name="unit"><option value="reps" ${ex.unit==='reps'?'selected':''}>Repetitions</option><option value="sec" ${ex.unit==='sec'?'selected':''}>Seconds</option></select></div></div><div class="field"><label for="exNotes">Technique cues (optional)</label><textarea name="notes" id="exNotes" maxlength="350">${esc(ex.notes||'')}</textarea></div><label class="checkbox-row"><input type="checkbox" name="optional" ${ex.optional?'checked':''}/><span>Optional exercise (does not count as a required set)</span></label><div class="modal-footer"><button type="button" class="btn ghost" data-action="close-modal">Cancel</button><button type="submit" class="btn">${editing?'Save changes':'Add exercise'}</button></div></form>`);$('#exName').focus();}
function saveExerciseForm(form){const p=getPlan(ui.selectedPlan);if(!p)return;const f=new FormData(form);const name=String(f.get('name')||'').trim();const min=num(f.get('min')),max=num(f.get('max')),sets=num(f.get('sets')),rest=num(f.get('rest'));if(!name||name.length>90||min<1||max<min||sets<1||sets>12||rest<0||rest>600){toast('Please check the name, sets and rep range.',true);return;}const idx=form.dataset.index!==''?Number(form.dataset.index):null;const original=idx===null?null:p.exercises[idx];const ex={id:original?.id||slug(name)||uid(),name,group:String(f.get('group')),sets,min,max,rest,notes:String(f.get('notes')||''),unit:f.get('unit')==='sec'?'sec':'reps',optional:f.has('optional')};if(idx===null)p.exercises.push(ex);else p.exercises[idx]=ex;queueSave();modalClose();render();toast(idx===null?'Exercise added to your plan.':'Exercise updated.');}
function exportBackup(){const backup={...state,exportedAt:new Date().toISOString(),app:'FitTrack v1'};const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`fittrack-backup-${localDate()}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('JSON backup download started.');}
async function importBackup(file){if(!file)return;try{if(file.size>20*1024*1024)throw new Error('Backup file is too large');const content=await file.text();const parsed=JSON.parse(content);const validated=validateState(parsed);if(!confirm(`Restore backup containing ${validated.history.length} completed workouts? This replaces your current plans, draft, and history.`))return;state=validated;ui.selectedPlan=state.plan[0]?.id||'push-a';await immediateSave();go('home');toast('Workout history and plan restored.');}catch(e){console.error(e);toast('Backup could not be restored. Check that it is a FitTrack JSON file.',true);}finally{$('#restoreFile').value='';}}
function resetApp(){if(!confirm('This will permanently erase your local workout history, plans and active session. Have you exported a backup?'))return;if(!confirm('Confirm again: erase all local FitTrack data?'))return;state=emptyState();ui.selectedPlan='push-a';stopRest();immediateSave();go('home');toast('Local FitTrack data reset.');}
async function durableStorage(){try{if(!navigator.storage?.persist){toast('Persistent storage is unavailable in this browser.',true);return;}const granted=await navigator.storage.persist();toast(granted?'Persistent storage granted on this browser.':'Browser did not grant persistence. Keep exporting backups.',!granted);}catch{toast('Persistent storage could not be requested.',true);}}
function installApp(){if(ui.installPrompt){const p=ui.installPrompt;ui.installPrompt=null;p.prompt();p.userChoice.then(c=>toast(c.outcome==='accepted'?'Install accepted!':'Use your browser menu to install later.'));return;}modalOpen(`<h2>Add FitTrack to your phone</h2><p>To install and get reliable offline use, first host this folder as an HTTPS website (for example via GitHub Pages).</p><div class="alert"><strong>Android Chrome:</strong> open your hosted URL → ⋮ menu → Install app or Add to Home screen.</div><div class="alert"><strong>iPhone Safari:</strong> open your hosted URL → Share → Add to Home Screen.</div><p>Opening an HTML file directly from Downloads is useful for a preview, but app installation and storage may not work reliably that way.</p><div class="modal-footer"><button class="btn" data-action="close-modal">Got it</button></div>`);}

  case 'delete-exercise':{const p=getPlan(ui.selectedPlan);const i=Number(button.dataset.index);if(p&&p.exercises[i]&&confirm(`Remove ${p.exercises[i].name} from this plan? Past logs stay unchanged.`)){p.exercises.splice(i,1);queueSave();render();}return;}
  case 'move-exercise':{const p=getPlan(ui.selectedPlan);const i=Number(button.dataset.index),next=i+Number(button.dataset.dir);if(p && next>=0 && next<p.exercises.length){[p.exercises[i],p.exercises[next]]=[p.exercises[next],p.exercises[i]];queueSave();render();}return;}
  case 'delete-history':{const h=state.history.find(h=>h.id===button.dataset.history);if(h&&confirm(`Delete your completed ${h.name} workout from ${datePrettyKey(h.date)}?`)){state.history=state.history.filter(x=>x.id!==h.id);queueSave();render();toast('Workout deleted.');}return;}
  case 'close-modal':modalClose();return;
  case 'export-data':exportBackup();return;
  case 'import-data':$('#restoreFile').click();return;
  case 'install-pwa':installApp();return;
  case 'persistent-storage':durableStorage();return;
  case 'reset-data':resetApp();return;
}}
function initEvents(){document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){go(nav.dataset.nav);return;}const action=e.target.closest('[data-action]');if(!action||action.matches('input,select,textarea'))return;act(action);});
  document.addEventListener('input',e=>{const el=e.target;if(el.matches('[data-field]')){const s=state.draft?.exercises[Number(el.dataset.ex)]?.sets[Number(el.dataset.set)];if(!s)return;const field=el.dataset.field;s[field]=el.value;queueSave();}else if(el.id==='librarySearch'){ui.libraryQuery=el.value;renderLibraryList();}else if(el.id==='sessionNotes'&&state.draft){state.draft.notes=el.value;queueSave();}});
  document.addEventListener('change',e=>{const el=e.target;if(el.dataset.action==='check-warmup'){toggleArrayValue(state.checklists,el.dataset.key,el.dataset.id,el.checked);}else if(el.dataset.action==='check-mobility'){toggleArrayValue(state.mobility,el.dataset.key,el.dataset.id,el.checked);}else if(el.dataset.action==='trend-exercise'){ui.trendExercise=el.value;render();}else if(el.dataset.action==='setting-rest'){state.settings.autoRest=el.checked;queueSave();render();}else if(el.matches('select[data-field]')){const s=state.draft?.exercises[Number(el.dataset.ex)]?.sets[Number(el.dataset.set)];if(s){s[el.dataset.field]=el.value;queueSave();}}});
  document.addEventListener('toggle',e=>{if(e.target.id==='prepDetails'&&document.contains(e.target))ui.prepOpen=e.target.open;},true);
  document.addEventListener('submit',e=>{if(e.target.id==='exerciseForm'){e.preventDefault();saveExerciseForm(e.target);}});
  $('#restoreFile').addEventListener('change',e=>importBackup(e.target.files?.[0]));
  $('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))modalClose();});
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();ui.installPrompt=e;});
  window.addEventListener('pagehide',()=>{if(ui.saveTimer)persistNow();});
  window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v.startsWith('guide/')){ui.guideId=decodeURIComponent(v.slice(6));ui.view='guide';render();return;}if(['home','session','plan','progress','settings','library','media'].includes(v)){ui.view=v;render();}});
  setInterval(()=>{if(state.draft){const el=$('#elapsedClock');if(el)el.textContent=formatTime((Date.now()-new Date(state.draft.startedAt).getTime())/1000);}},30000);
}
async function boot(){initEvents();try{await loadState();}catch(e){console.error(e);ui.storageMode='memory';}const hash=location.hash.replace('#','');ui.view=hash.startsWith('guide/')?'guide':(['home','session','plan','progress','settings','library','media'].includes(hash)?hash:'home');if(hash.startsWith('guide/'))ui.guideId=decodeURIComponent(hash.slice(6));ui.selectedPlan=state.plan[0]?.id||'push-a';render();if('serviceWorker' in navigator&&location.protocol!=='file:'&&location.hostname!==''){navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Offline registration unavailable',err));}if(ui.storageMode==='memory')toast('Browser storage disabled — backup your data.',true);}
boot();
</script></body>
</html>
