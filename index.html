<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0b1b" />
  <meta name="description" content="FitTrack — an offline-first PPL workout companion that tracks sets, progress and mobility privately on your device." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FitTrack" />
  <link rel="manifest" href="./manifest.webmanifest" /><link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  
  
  
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/features.css" />
  <link rel="stylesheet" href="./assets/css/theme.css" />
  <title>FitTrack Pro — Video Coach</title>
  
  













</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand"><div class="brand-mark" aria-hidden="true">F<span>↗</span></div><div><strong>FitTrack</strong><small>BUILD EVERY DAY</small></div></div>
      <nav class="desktop-nav" aria-label="Main menu">
        <button class="nav-item active" data-nav="home"><span class="nav-symbol">⌂</span><span>Dashboard</span></button>
        <button class="nav-item" data-nav="session"><span class="nav-symbol">▰</span><span>Workout</span></button>
        <button class="nav-item" data-nav="plan"><span class="nav-symbol">▦</span><span>My plan</span></button>
        <button class="nav-item" data-nav="library"><span class="nav-symbol">▤</span><span>Exercise guides</span></button>
        <button class="nav-item" data-nav="media"><span class="nav-symbol">▶</span><span>Video coach</span></button>
        <button class="nav-item" data-nav="progress"><span class="nav-symbol">▥</span><span>Progress</span></button>
        <button class="nav-item" data-nav="settings"><span class="nav-symbol">⚙</span><span>Settings</span></button>
      </nav>
      <div class="sidebar-bottom"><span class="side-dot"></span> YOUR DATA STAYS ON THIS DEVICE <div class="side-small">Offline-first • No account required</div></div>
    </aside>
    <div class="app-main">
      <header class="topbar"><div><span class="topbar-eyebrow">PERSONAL TRAINING SYSTEM</span><div class="topbar-title" id="headerTitle">Dashboard</div></div><div class="topbar-right"><span id="storageChip" class="storage-chip">● Local storage</span><span class="date-chip" id="headerDate"></span><button aria-label="Settings" title="Settings and backup" class="quick-settings" data-nav="settings">⚙</button></div></header>
      <main id="app" class="content" aria-live="polite"><div class="loading"><div class="spinner"></div>Loading your gym tracker…</div></main>
    </div>
  </div>
  <nav class="bottom-nav" aria-label="Mobile navigation">
    <button aria-label="Home" data-nav="home" class="active"><span>⌂</span><small>Home</small></button>
    <button aria-label="Workout" data-nav="session"><span>▰</span><small>Workout</small></button>
    <button aria-label="Plan" data-nav="plan"><span>▦</span><small>Plan</small></button>
    <button aria-label="Exercises" data-nav="library"><span>◉</span><small>Exercises</small></button>
    <button aria-label="Videos" data-nav="media"><span>▶</span><small>Videos</small></button>
    <button aria-label="Progress" data-nav="progress"><span>▥</span><small>Progress</small></button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="restTimer" class="rest-timer hidden" aria-live="polite"></div>
  <dialog id="modal" class="modal"><div id="modalBody"></div></dialog>
  <input type="file" id="restoreFile" accept=".json,application/json" hidden />
<script defer src="./assets/js/guides.js"></script>
<script defer src="./assets/js/exercise-data.js"></script>
<script defer src="./assets/js/video-data.js"></script>
<script defer src="./assets/js/app.js"></script></body>
</html>
