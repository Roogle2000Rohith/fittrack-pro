/* FITTRACK PRO: movement library and midnight-violet training UI */
:root { --bg:#0b0b17; --surface:#141428; --surface2:#1c1b36; --surface3:#292746; --border:#30304d; --text:#f7f5ff; --muted:#aaa9c5; --accent:#a78bfa; --accent-dark:#30234e; --violet:#bda9ff; --blue:#8ba8ff; --danger:#ff8b9d; }
body {background:radial-gradient(ellipse at 80% -20%,#242049 0,transparent 46%),var(--bg)}
.sidebar {background:#101022;border-color:#2e2b4c}
.brand-mark {background:linear-gradient(135deg,#8c5af8,#bc9aff);color:white;box-shadow:0 6px 22px #7b4ce856}
.nav-item.active,.nav-item:hover {background:#211c3c}
.topbar {background:#111126e6;border-color:#2e2b4c}
.storage-chip {color:#a8e8b9}
.btn:not(.ghost):not(.secondary):not(.danger) {background:linear-gradient(110deg,#8054eb,#a377f8);color:white;box-shadow:0 7px 24px #6336d42e}
.btn:not(.ghost):not(.secondary):not(.danger):hover {filter:brightness(1.1)}
.btn.secondary {background:#2d2448;color:#e4d6ff;border-color:#48355c}
input,select,textarea {background:#111224;border-color:#393453}
input:focus,select:focus,textarea:focus {border-color:#9c78f9;box-shadow:0 0 0 2px #a98aff30}
.hero {background:linear-gradient(120deg,#272046,#17162b 70%);border-color:#4b3d74}
.hero:after {opacity:.12;filter:hue-rotate(58deg)}
.panel,.exercise-card {background:#151527;border-color:#31304d}
.session-prep {background:#16152b}
.bottom-nav{background:#131223f5}
.bottom-nav button.active {background:#9c78f91a}
.progress-bar>div{background:linear-gradient(90deg,#8055ec,#b59fff)}
.week-day.today {border-color:#926df7}
.pill.green{background:#133729;color:#a9f4c4}
.set-row.complete {background:#212440}
.complete-set.yes {background:#9b79ff;color:white}
.set-note {background:#24213c;border-color:#453566}
.guide-button {white-space:normal;text-align:center}

const guideFor = ex => GUIDES[String(ex?.id||ex?.exerciseId||'')] || GUIDES[slug(ex?.name||'')] || null;
function allExercises(){const unique = new Map();for (const p of state.plan){for (const ex of p.exercises){if(!unique.has(ex.id))unique.set(ex.id,ex);}}return Array.from(unique.values());}
function guideThumb(ex){return exerciseMediaThumb(ex);}
function splitCues(value){return String(value||'').split(/;\s*/).map(v=>v.trim()).filter(Boolean);}
function guideLink(ex,label='Technique guide',kind='secondary'){return `<button class="btn ${kind} small guide-button" data-action="open-guide" data-guide="${esc(ex.id||ex.exerciseId||slug(ex.name))}">${esc(label)} ↗</button>`;}
function guideReturn(){const back=ui.guideBack||'library';go(back==='guide'?'library':back);if(back==='session'&&state.draft){const i=state.draft.exercises.findIndex(x=>x.exerciseId===ui.guideId);if(i>=0)setTimeout(()=>document.getElementById(`exercise-${i}`)?.scrollIntoView({block:'start',behavior:'smooth'}),50);}}
function goGuide(id,back=ui.view){ui.guideId=String(id);ui.guideBack=back==='guide'?'library':back;ui.view='guide';history.replaceState(null,'',`#guide/${encodeURIComponent(ui.guideId)}`);render();window.scrollTo({top:0,behavior:'instant'});}
function renderLibraryList(){const target=$('#guideLibraryResults');if(!target)return;const text=ui.libraryQuery.trim().toLowerCase();const exercises=allExercises().filter(ex=>{const g=guideFor(ex);const terms=[ex.name,ex.group,g?.primary,g?.secondary].join(' ').toLowerCase();return (ui.libraryGroup==='All'||(ex.group===ui.libraryGroup))&&terms.includes(text);});target.innerHTML=exercises.length?exercises.map(ex=>`<button class="library-exercise" data-action="open-guide" data-guide="${esc(ex.id)}"><span>${guideThumb(ex)}</span><span class="library-exercise-copy"><strong>${esc(ex.name)}</strong><small>${esc(guideFor(ex)?.primary||ex.group)} · ${guideFor(ex)?'start/finish photos + coaching':'Custom exercise notes'}</small></span><span class="library-chevron">›</span></button>`).join(''):`<div class="empty">No exercises found. Try a different search.</div>`;
  const count=$('#guideResultsCount');if(count)count.textContent=`${exercises.length} exercise${exercises.length===1?'':'s'}`;
}
function renderLibrary(){const list=allExercises();const groups=['All',...new Set(list.map(x=>x.group))];return `${head('LEARN THE MOVEMENT','Exercise library','Licensed exercise illustrations, useful video references and technique cues for your plan.')}<div class="guide-intro panel"><div class="guide-intro-icon">◧</div><div><h3>Form first. Progress follows.</h3><p>Browse the exercises in your PPL program. Illustrations show the nearest available exercise variation; check the equipment notes. Adjust to your machine and body, and use a trainer when unsure.</p></div></div><div class="library-search"><span>⌕</span><input id="librarySearch" aria-label="Search exercises" autocomplete="off" placeholder="Search chest, lats, hip thrust…" value="${esc(ui.libraryQuery)}"/></div><div class="library-filters">${groups.map(g=>`<button class="filter-chip ${ui.libraryGroup===g?'active':''}" data-action="guide-filter" data-group="${esc(g)}">${esc(g)}</button>`).join('')}</div><div class="library-count" id="guideResultsCount">${list.length} exercises</div><div id="guideLibraryResults" class="library-results">${list.map(ex=>`<button class="library-exercise" data-action="open-guide" data-guide="${esc(ex.id)}"><span>${guideThumb(ex)}</span><span class="library-exercise-copy"><strong>${esc(ex.name)}</strong><small>${esc(guideFor(ex)?.primary||ex.group)} · ${guideFor(ex)?'start/finish photos + coaching':'Custom exercise notes'}</small></span><span class="library-chevron">›</span></button>`).join('')}</div>`;}
function renderGuide(){const id=ui.guideId;const ex=allExercises().find(e=>e.id===id) || state.draft?.exercises.find(e=>e.exerciseId===id);if(!ex)return `${head('EXERCISE GUIDES','Guide not found','This movement might have been removed from your routine.')}<button class="btn" data-action="return-guide">← Back</button>`;const g=guideFor(ex);const sets=getLastSets(ex.id||ex.exerciseId);const activeIndex=state.draft?.exercises.findIndex(e=>e.exerciseId===(ex.id||ex.exerciseId))??-1;const focus=g?.primary||ex.group;

const picture=exerciseMediaGallery(ex);

const previous=sets.length?sets.slice(0,3).map(s=>`${weightDisplay(s.weight)} ${weightUnit()} × ${num(s.reps)} ${ex.unit==='sec'?'sec':'reps'}`).join(' · '):'No completed sets yet';
return `<div class="guide-page">${b}<div class="guide-heading"><div class="eyebrow">EXERCISE TECHNIQUE · YOUR PPL PLAN</div><h1>${esc(ex.name)}</h1><p>${esc(focus)}${g&&g.secondary&&g.secondary!=='—'?' · Supporting: '+esc(g.secondary):''}</p></div>${videoGuide(id)}${picture}${g?`<div class="guide-warning-inline">ⓘ Images show exercise patterns, not always your exact machine or cable attachment. Follow the technique notes, and stop if a movement causes pain.</div>`:''}<div class="guide-detail-layout"><div class="guide-main"><div class="panel guide-panel"><div class="guide-section-title"><span class="guide-marker">01</span><h3>Set up correctly</h3></div><p>${esc(g?.setup||ex.notes||'Choose a load you can move comfortably with good control.')}</p></div><div class="panel guide-panel"><div class="guide-section-title"><span class="guide-marker">02</span><h3>Key technique points</h3></div><ul class="coaching-list">${(steps.length?steps:['Use controlled repetitions','Move through a comfortable range','Avoid using momentum']).map(item=>`<li><span class="good-mark">✓</span><span>${esc(item)}</span></li>`).join('')}</ul></div><div class="panel guide-panel mistake-panel"><div class="guide-section-title"><span class="guide-marker error">03</span><h3>Common mistakes to avoid</h3></div>${mistakes.length?`<ul class="coaching-list">${mistakes.map(x=>`<li><span class="bad-mark">×</span><span>${esc(x)}</span></li>`).join('')}</ul>`:'<p>Focus on stable posture and avoid momentum or painful ranges.</p>'}</div>${['hack-squat','45-leg-press','hip-thrust-machine'].includes(id)?`<div class="alert warning guide-alert"><strong>Lower-back consideration:</strong> Start light, keep your trunk supported and stable, and stay within a comfortable range. If symptoms return, stop the movement and seek qualified guidance.</div>`:''}</div><div class="guide-aside"><div class="panel coach-panel"><div class="mini-label">YOUR TRAINING TARGET</div><h3>${num(ex.sets)} sets × ${num(ex.min)}–${num(ex.max)} ${ex.unit==='sec'?'sec':'reps'}</h3><div class="coach-facts"><span>◎ ${num(ex.rest)}s rest</span><span>◉ 1–3 reps in reserve</span></div><div class="coach-divider"></div><div class="mini-label">LAST COMPLETED SESSION</div><p class="guide-previous">${esc(previous)}</p><div class="coach-divider"></div><h4>Progressive overload</h4><p>Hit the top of your rep range with good technique and 1–3 reps left. Then try the smallest reasonable weight increase next session.</p>${activeIndex>=0?`<button class="btn full" data-action="go-active-exercise" data-guide="${esc(id)}">↗ Continue logging this exercise</button>`:`<button class="btn full" data-action="return-guide">← Back to ${ui.guideBack==='plan'?'your plan':'exercise list'}</button>`}</div><div class="panel brief-panel"><strong>Breathing & tempo</strong><p>Breathe normally and avoid unnecessary breath-holding. Lift deliberately and control the lowering phase, typically around 2 seconds, rather than chasing a specific tempo.</p></div></div></div></div>`;
}
function navHeader(){const names={home:'Dashboard',session:'Workout tracker',plan:'Training plan',library:'Exercise guides',guide:'Exercise technique',media:'Video coach',progress:'Progress & history',settings:'Settings & backup'};$('#headerTitle').textContent=names[ui.view]||'Dashboard';$('#headerDate').textContent=prettyDate();$('#storageChip').textContent=ui.storageMode==='indexeddb'?'● Saved on device':ui.storageMode==='localStorage'?'● Basic browser storage':'● Storage unavailable';$$('[data-nav]').forEach(el=>el.classList.toggle('active',el.dataset.nav===(ui.view==='guide'?'library':ui.view)));}
function render(){navHeader();const pages={home:renderHome,session:renderSession,plan:renderPlan,library:renderLibrary,guide:renderGuide,media:renderMedia,progress:renderProgress,settings:renderSettings};$('#app').innerHTML=(pages[ui.view]||renderHome)();renderTimer();}
function head(eyebrow,title,subtitle='',action=''){return `<div class="page-heading"><div><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1>${subtitle?`<p>${esc(subtitle)}</p>`:''}</div>${action}</div>`;}
function pill(text,color=''){return `<span class="pill ${color}">${esc(text)}</span>`;}
function planRow(ex,i,actions=false){return `<div class="exercise-plan"><div class="exercise-number">${pad2(i+1)}</div><div class="plan-exercise-media" aria-hidden="true">${guideThumb(ex)}</div><div class="exercise-plan-info"><strong>${esc(ex.name)}</strong><button class="inline-guide" data-action="open-guide" data-guide="${esc(ex.id)}">↗ See form & technique</button><p>${num(ex.sets)} sets · ${num(ex.min)}–${num(ex.max)} ${ex.unit==='sec'?'sec':'reps'} · ${num(ex.rest)} sec rest ${ex.optional?'· Optional':''}</p>${ex.notes?`<p>${esc(ex.notes)}</p>`:''}</div>${actions?`<div class="plan-actions"><button class="btn ghost small icon-btn" title="Move up" data-action="move-exercise" data-index="${i}" data-dir="-1">↑</button><button class="btn ghost small icon-btn" title="Move down" data-action="move-exercise" data-index="${i}" data-dir="1">↓</button><button class="btn secondary small icon-btn" title="Edit" data-action="edit-exercise" data-index="${i}">✎</button><button class="btn ghost small icon-btn" title="Remove" data-action="delete-exercise" data-index="${i}">×</button></div>`:''}</div>`;}
function weeklyStrip(){const base=monday();const done=workoutDoneDays();return `<div class="week-strip">${Array.from({length:7},(_,i)=>{const date=dateShift(base,i);const k=localDate(date);const pid=calendarMap[date.getDay()];const pl=pid?getPlan(pid):null;return `<button class="week-day ${k===localDate()?'today':''} ${done.has(k)?'done':''}" title="${esc(pid?pl?.name||pid:'Recovery day')}" data-action="choose-week-day" data-day="${date.getDay()}"><strong>${['MON','TUE','WED','THU','FRI','SAT','SUN'][i]}</strong><div class="week-symbol">${done.has(k)?'✓':pid?(pl?.type==='legs'?'◈':pl?.type==='pull'?'↙':'↗'):'☾'}</div><span>${pid?esc(pl?.short||'Workout'):'Rest'}</span></button>`;}).join('')}</div>`;}
function warmupChecklist(p){const arr=warmups[p.type]||warmups.push;const key=`${localDate()}|${p.id}|warmup`;const done=state.checklists[key]||[];return `<div class="panel"><div class="panel-header"><div><h3>Before you lift</h3><p>Dynamic warm-up · 8–15 min</p></div>${pill(`${done.length}/${arr.length}`,'green')}</div>${arr.map(([id,label])=>`<label class="checkbox-row ${done.includes(id)?'checked':''}"><input type="checkbox" data-action="check-warmup" data-key="${esc(key)}" data-id="${esc(id)}" ${done.includes(id)?'checked':''}/><span>${esc(label)}</span></label>`).join('')}<button class="btn secondary small full coach-video-cta" data-action="open-media" data-stage="warmup" data-type="${esc(p.type)}">▶ Watch warm-up videos</button><p class="muted-note">Warm-up sets prepare you for working weight; they don't count toward your programmed sets.</p></div>`;}
function cooldownBox(p){return `<div class="panel"><div class="panel-header"><div><h3>After training</h3><p>5–10 min cooldown</p></div><span class="pill">Recovery</span></div>${(cooldowns[p.type]||[]).map(item=>`<div class="checkbox-row">✓ <span>${esc(item)}</span></div>`).join('')}<button class="btn secondary small full coach-video-cta" data-action="open-media" data-stage="cooldown" data-type="${esc(p.type)}">▶ Watch cooldown video</button><p class="muted-note">Gentle stretching supports flexibility but is not required to prevent soreness.</p></div>`;}
function renderHome(){const p=getPlan(todayPlan());const date=prettyDate();const s=stats();const done=workoutDoneDays();const todayName=p?p.name:'Recovery & mobility day';const hero=p?`<div class="hero"><div class="hero-content"><div class="eyebrow">${esc(date.toUpperCase())} · TODAY'S PLAN</div><h2>${esc(todayName)}</h2><p>${esc(p.focus)}. Follow your sets, log your weights, and build strength with a repeatable system.</p><div class="hero-tags">${pill(`${p.exercises.length} exercises`)}${pill(`${countTarget(p)} planned sets`)}${pill('6:00–8:00 AM window')}${todayCompleted()?pill('Completed today','green'):''}</div><div class="btn-row"><button class="btn" data-action="start-workout" data-plan="${esc(p.id)}">${state.draft?.planId===p.id?'↗ Resume workout':'↗ Start workout'}</button><button class="btn ghost" data-action="preview-today">View exercises →</button><button class="btn ghost" data-nav="library">◧ Exercise guides</button><button class="btn ghost" data-action="open-media" data-stage="warmup" data-type="${esc(p.type)}">▶ Video coach</button></div></div></div>`:`<div class="hero"><div class="hero-content"><div class="eyebrow">${esc(date.toUpperCase())} · REST DAY</div><h2>Recovery is part of progress.</h2><p>Sunday is for gentle mobility, easy walking, good food and enough sleep. You don't need to lift every day to improve.</p><div class="hero-tags">${pill('20-min mobility')}${pill('No heavy training')}</div><button class="btn" data-action="scroll-mobility">Open mobility checklist ↓</button></div></div>`;
return `${head('GOOD MORNING','Make every rep count.','Your six-day Push / Pull / Legs plan, organized for early mornings.')}${hero}<div class="grid four-col" style="margin-bottom:18px"><div class="panel stat"><div class="stat-title">WORKOUTS THIS WEEK</div><div class="stat-value">${s.week}<span class="muted"> / 6</span></div><div class="stat-foot">Monday to Sunday</div></div><div class="panel stat"><div class="stat-title">TOTAL SESSIONS</div><div class="stat-value">${s.total}</div><div class="stat-foot">All recorded workouts</div></div><div class="panel stat"><div class="stat-title">SETS COMPLETED</div><div class="stat-value">${s.allSets}</div><div class="stat-foot">Working + drop sets</div></div><div class="panel stat"><div class="stat-title">TRAINING VOLUME</div><div class="stat-value">${displayVolume(s.volume)}</div><div class="stat-foot">${weightUnit()} × reps, logged loads</div></div></div><div class="grid two-col"><div><div class="panel"><div class="panel-header"><div><h3>Your training week</h3><p>Tap a day to review or start that plan</p></div></div>${weeklyStrip()}</div><div class="panel" style="margin-top:16px"><div class="panel-header"><div><h3>${p?'Today’s exercises':'Next session preview'}</h3><p>${p?esc(p.short):'Monday · Push A'}</p></div><button class="btn ghost small" data-action="preview-today">Full plan →</button></div>${(p||getPlan('push-a')).exercises.slice(0,5).map((ex,i)=>`<div class="workout-mini"><div class="num">${i+1}</div><div class="mini-body"><strong>${esc(ex.name)}</strong><small>${ex.sets} × ${ex.min}–${ex.max} ${ex.unit==='sec'?'sec':'reps'} · ${esc(ex.group)}</small></div><span class="muted">›</span></div>`).join('')}</div></div><div><div id="mobilityAnchor">${p?warmupChecklist(p):renderMobility(true)}</div><div style="margin-top:16px">${p?cooldownBox(p):`<div class="panel"><h3>Next up: Push A</h3><p class="muted small">Monday · Chest and triceps. Resume your split after your recovery day.</p><button class="btn secondary small" data-action="choose-plan" data-plan="push-a">Open Monday plan →</button></div>`}</div></div></div>${state.draft?`<div class="alert" style="margin-top:17px">You have an unfinished <strong>${esc(state.draft.name)}</strong> workout. Your completed and unfinished sets are being saved locally. <button class="btn small secondary" data-nav="session">Resume it →</button></div>`:''}<p class="footline">Your logged workouts stay on this device. Export a JSON backup regularly from Settings so browser cleanup or phone replacement doesn't erase your history.</p>`;}
function renderMobility(isHome=false){const key=localDate();const done=state.mobility[key]||[];return `<div class="panel"><div class="panel-header"><div><h3>Sunday mobility reset</h3><p>7 movements · 20 minutes · no forcing</p></div>${pill(`${done.length}/7 done`,'purple')}</div><div class="progress-bar" style="margin-bottom:8px"><div style="width:${Math.round(done.length/mobilityItems.length*100)}%"></div></div>${mobilityItems.map(([id,name,time])=>`<div class="mobi-row"><label class="checkbox-row ${done.includes(id)?'checked':''}"><input type="checkbox" data-action="check-mobility" data-key="${esc(key)}" data-id="${id}" ${done.includes(id)?'checked':''}/><span>${esc(name)}</span></label><span class="mobi-time">${esc(time)}</span></div>`).join('')}<button class="btn secondary small full coach-video-cta" data-action="open-media" data-stage="mobility">▶ Watch mobility guides</button><p class="muted-note">This checklist is dated today. You can use it on any rest day; the plan remains Sunday-focused.</p></div>`;}

function prevText(exerciseId,unit='reps'){const vals=getLastSets(exerciseId);if(!vals.length)return 'No previous sets logged';return `Last: ${vals.slice(0,3).map(s=>`${weightDisplay(s.weight)}${weightUnit()} × ${num(s.reps)}${unit==='sec'?'s':''}`).join(' · ')}`;}
function renderSetRow(ex,ei,s,si){const prior=getLastSets(ex.exerciseId).filter(v=>v.type!=='warmup');const pv=prior[si];return `<tr class="set-row ${s.done?'complete':''}"><td><button class="set-label ${esc(s.type==='drop'?'drop':s.type==='warmup'?'warmup':'')}" data-action="cycle-set-type" data-ex="${ei}" data-set="${si}" title="Tap to change: working → warm-up → drop">${s.type==='warmup'?'W':s.type==='drop'?'D':si+1}</button></td><td><span class="muted tiny" title="Previous workout">${pv?`${weightDisplay(pv.weight)}×${num(pv.reps)}`:'—'}</span></td><td><input aria-label="${esc(ex.name)} set ${si+1} weight in ${weightUnit()}" inputmode="decimal" type="number" step="0.5" min="0" data-ex="${ei}" data-set="${si}" data-field="weight" value="${esc(weightDisplay(s.weight))}" /></td><td><input aria-label="${esc(ex.name)} set ${si+1} ${ex.unit==='sec'?'seconds':'repetitions'}" inputmode="numeric" type="number" step="1" min="0" data-ex="${ei}" data-set="${si}" data-field="reps" value="${esc(s.reps)}" placeholder="—" /></td><td><select aria-label="${esc(ex.name)} set ${si+1} reps in reserve" data-ex="${ei}" data-set="${si}" data-field="rir">${[0,1,2,3,4,5].map(v=>`<option ${num(s.rir)===v?'selected':''} value="${v}">${v}${v===5?'+':''}</option>`).join('')}</select></td><td><button class="complete-set ${s.done?'yes':''}" data-action="toggle-set" data-ex="${ei}" data-set="${si}" title="${s.done?'Mark incomplete':'Complete this set'}">${s.done?'✓':'○'}</button></td></tr>`;}
function progressionHint(ex){const prev=getLastSets(ex.exerciseId).filter(s=>s.type==='working');if(!prev.length)return 'First time? Pick a load you can control with about 2 reps left in reserve.';const repMax=num(ex.max);const required=ex.sets.filter(s=>s.type==='working').length;const qualified=prev.length>=required && prev.slice(0,required).every(s=>num(s.reps)>=repMax && num(s.rir)>=1 && num(s.weight)>0);return qualified?'Previous session reached the rep ceiling on all working sets: consider the smallest available weight increase if form stays solid.':'Use your previous working weight and try to add a good rep before increasing the load.';}
function renderExerciseCard(ex,i){const done=working(ex.sets).length;const target=ex.sets.filter(s=>s.type==='working').length;return `<section class="exercise-card" id="exercise-${i}"><div class="exercise-head"><div class="idx">${i+1}</div><div class="plan-exercise-media">${guideThumb(ex)}</div><div class="exercise-namebox"><h3>${esc(ex.name)}</h3><p>${esc(ex.group)} · ${num(ex.min)}–${num(ex.max)} ${ex.unit==='sec'?'seconds':'reps'} · ${num(ex.rest)}s rest ${ex.optional?'· Optional':''}</p><p>${esc(ex.notes||'')}</p></div>${pill(`${done}/${target} done`,done>=target&&target?'green':'')}</div><div class="exercise-guide-cta">${guideLink(ex,'▶ Watch technique & log')}</div><div class="last-badge">↶ ${esc(prevText(ex.exerciseId,ex.unit))}</div><div class="set-note">↗ ${esc(progressionHint(ex))}</div><div style="overflow-x:auto"><table class="set-table"><thead><tr><th>Set</th><th>Previous</th><th>${weightUnit()}</th><th>${ex.unit==='sec'?'Sec':'Reps'}</th><th>RIR</th><th>✓</th></tr></thead><tbody>${ex.sets.map((s,si)=>renderSetRow(ex,i,s,si)).join('')}</tbody></table></div><div class="exercise-foot"><div class="buttons"><button class="btn secondary small" data-action="add-set" data-ex="${i}" data-type="working">+ Set</button><button class="btn ghost small" data-action="add-set" data-ex="${i}" data-type="warmup">+ Warm-up</button><button class="btn ghost small" data-action="add-set" data-ex="${i}" data-type="drop">+ Drop</button><button class="btn ghost small" data-action="remove-set" data-ex="${i}">− Last</button></div><span class="muted tiny">${ex.rest}s rest</span></div></section>`;}
function renderSession(){const draft=state.draft;if(!draft){const today=todayPlan();return `${head('WORKOUT TRACKER','Ready to train?','Choose a session below. Your active workout autosaves after each change.')}<div class="hero"><div class="hero-content"><div class="eyebrow">YOUR NEXT WORKOUT</div><h2>${esc(getPlan(today)?.name||'Pick your training day')}</h2><p>Log weight, reps, RIR, warm-ups and drop sets. Your last workout loads will be suggested automatically.</p>${today?`<button class="btn" data-action="start-workout" data-plan="${esc(today)}">Start today’s workout ↗</button>`:''}</div></div>${planSelector('')}<div class="grid three-col">${state.plan.map(p=>`<div class="panel"><div class="mini-label">${esc(p.focus)}</div><h3 style="margin:10px 0">${esc(p.short)}</h3><p class="muted small">${p.exercises.length} exercises · ${countTarget(p)} working sets</p><button class="btn secondary small full" data-action="start-workout" data-plan="${esc(p.id)}">Start ${esc(p.short)}</button></div>`).join('')}</div>`;}
const elapsed=Math.max(0,Math.floor((Date.now()-new Date(draft.startedAt).getTime())/1000));const total=totalPlanned();const done=totalDone();const p=getPlan(draft.planId)||{type:'push',id:draft.planId,name:draft.name};
return `<div class="eyebrow" style="margin-bottom:12px">● LIVE WORKOUT · LOG YOUR SETS</div><div class="session-banner"><div><div class="mini-label">ACTIVE WORKOUT · ${esc(new Date(draft.startedAt).toLocaleDateString(undefined,{weekday:'long'}))}</div><h2>${esc(draft.name)}</h2><div class="session-summary"><span><strong>${done}/${total}</strong> sets done</span><span><strong id="elapsedClock">${formatTime(elapsed)}</strong> elapsed</span><span><strong>${draft.exercises.length}</strong> exercises</span></div></div><div class="btn-row"><button class="btn ghost small" data-action="open-media" data-stage="warmup" data-type="${esc(p.type)}">▶ Warm-up video</button><button class="btn ghost small" data-action="manual-rest" data-seconds="90">⏱ 90s rest</button><button class="btn secondary small" data-action="finish-workout">Finish workout ✓</button></div></div><div class="progress-bar" style="margin:0 0 17px"><div style="width:${Math.min(100,Math.round(done/Math.max(total,1)*100))}%"></div></div><details id="prepDetails" class="session-prep" ${ui.prepOpen?'open':''}><summary><span>☀ Warm-up & training tips <small>8–15 min • tap to ${ui.prepOpen?'hide':'expand'}</small></span><span class="prep-chevron">⌄</span></summary><div class="grid two-col" style="margin-top:13px"><div>${warmupChecklist(p)}</div><div class="panel"><div class="panel-header"><div><h3>Workout rules</h3><p>Simple progression, not endless sets</p></div></div><div class="muted small" style="line-height:1.9">• Most sets: <strong style="color:var(--text)">1–3 RIR</strong><br/>• Heavy compound sets: 2–3 min rest<br/>• Isolation sets: 60–120 s rest<br/>• Reach the top of the rep range on quality sets before adding weight.<br/>• Optional drop set on a safe isolation exercise.</div></div></div></details><div class="grid" style="gap:0">${draft.exercises.map(renderExerciseCard).join('')}</div><div class="panel" style="margin-bottom:15px"><div class="panel-header"><h3>Session notes</h3></div><textarea id="sessionNotes" placeholder="Energy, form notes, discomfort, how the session felt…">${esc(draft.notes||'')}</textarea></div>${cooldownBox(p)}<div class="btn-row" style="margin-top:18px"><button class="btn" data-action="finish-workout">✓ Finish & save workout</button><button class="btn danger" data-action="discard-workout">Discard session</button></div><p class="footline">Autosaved to your phone browser. If the app or tab closes, return to the Workout tab to resume. Back up regularly via Settings.</p>`;}
function finishWorkout(){const d=state.draft;if(!d)return;const all=d.exercises.flatMap(ex=>ex.sets.filter(s=>s.done).map(s=>({...s,exerciseId:ex.exerciseId,name:ex.name,group:ex.group,unit:ex.unit})));const strength=all.filter(s=>s.type!=='warmup');if(!strength.length){toast('Complete at least one working set before finishing.',true);return;}const incomplete=d.exercises.reduce((n,ex)=>n+ex.sets.filter(s=>!s.done&&s.type==='working'&&!ex.optional).length,0);if(incomplete && !confirm(`${incomplete} planned working sets are unfinished. Save this workout anyway?`))return;const endedAt=new Date().toISOString();state.history.push({id:d.id,planId:d.planId,name:d.name,date:localDate(),startedAt:d.startedAt,endedAt,durationSec:Math.round((Date.now()-new Date(d.startedAt).getTime())/1000),sets:all,notes:d.notes||''});state.draft=null;stopRest();immediateSave();go('progress');toast(`Saved ${strength.length} working sets. Strong work!`);}
function timerBeep(){try{const AudioCtx=window.AudioContext||window.webkitAudioContext;if(AudioCtx){const context=new AudioCtx();const osc=context.createOscillator(),gain=context.createGain();osc.connect(gain);gain.connect(context.destination);osc.frequency.setValueAtTime(880,context.currentTime);gain.gain.setValueAtTime(0.04,context.currentTime);gain.gain.exponentialRampToValueAtTime(.001,context.currentTime+.16);osc.start();osc.stop(context.currentTime+.17);osc.onended=()=>context.close();}if(navigator.vibrate)navigator.vibrate([100,60,100]);}catch{}}
function startRest(seconds){ui.restEnd=Date.now()+Math.max(5,num(seconds,90))*1000;state.restEndsAt=ui.restEnd;queueSave();clearInterval(ui.restInterval);ui.restInterval=setInterval(()=>{renderTimer();const c=$('#elapsedClock');if(c&&state.draft)c.textContent=formatTime((Date.now()-new Date(state.draft.startedAt).getTime())/1000);},1000);renderTimer();}
function stopRest(){ui.restEnd=0;state.restEndsAt=0;queueSave();clearInterval(ui.restInterval);ui.restInterval=null;renderTimer();}
function renderTimer(){const el=$('#restTimer');if(!el)return;if(!ui.restEnd){el.classList.add('hidden');return;}const rem=Math.ceil((ui.restEnd-Date.now())/1000);if(rem<=0){stopRest();timerBeep();toast('Rest complete — ready for the next set');return;}el.classList.remove('hidden');el.innerHTML=`<span class="muted tiny">REST TIMER</span><strong>${formatTime(rem)}</strong><button class="btn small secondary" data-action="add-rest">+30s</button><button class="close" data-action="stop-rest" title="End rest">✕</button>`;}

function setDone(exIndex,setIndex){const ex=state.draft?.exercises[exIndex];const s=ex?.sets[setIndex];if(!s)return;if(!s.done && (!Number.isFinite(Number(s.reps))||num(s.reps)<=0)){toast(`Enter ${ex.unit==='sec'?'seconds':'reps'} before completing this set.`,true);return;}if(!s.done && (!Number.isFinite(Number(s.weight))||num(s.weight)<0)){toast('Enter a valid non-negative weight.',true);return;}s.done=!s.done;s.completedAt=s.done?new Date().toISOString():undefined;queueSave();render();if(s.done && state.settings.autoRest)startRest(ex.rest);}
function setType(exIndex,setIndex){const s=state.draft?.exercises[exIndex]?.sets[setIndex];if(!s)return;s.type=({working:'warmup',warmup:'drop',drop:'working'})[s.type]||'working';queueSave();render();}
function addSet(exIndex,type){const ex=state.draft?.exercises[exIndex];if(!ex)return;const last=ex.sets.at(-1);const weight=type==='drop'?Math.max(0,+(num(last?.weight)*.75).toFixed(1)):num(last?.weight);ex.sets.push({id:uid(),type,weight,reps:'',rir:type==='warmup'?4:2,done:false});queueSave();render();const card=$(`#exercise-${exIndex}`);card?.scrollIntoView({block:'center'});}
function removeSet(exIndex){const ex=state.draft?.exercises[exIndex];if(!ex||ex.sets.length<=1){toast('At least one set must remain.',true);return;}const s=ex.sets.at(-1);if(s.done&&!confirm('Remove the last completed set?'))return;ex.sets.pop();queueSave();render();}
function barChart(weekly){const w=640,h=240,left=30,top=20,bottom=198,chartH=bottom-top;const max=Math.max(3,...weekly.map(x=>x.count));return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Weekly completed workouts chart">${[0,1,2,3].map(i=>{const yy=bottom-i/3*chartH;return `<line x1="${left}" y1="${yy}" x2="620" y2="${yy}" stroke="#344247" stroke-dasharray="3 6"/><text x="22" y="${yy+4}" fill="#81918a" font-size="10" text-anchor="end">${Math.round(max*i/3)}</text>`;}).join('')}${weekly.map((v,i)=>{const bw=42;const x=left+16+i*74;const hh=v.count/max*(chartH-8);return `<rect x="${x}" y="${bottom-hh}" width="${bw}" height="${hh||2}" rx="7" fill="${i===weekly.length-1?'#a68aff':'#625291'}"/><text x="${x+bw/2}" y="${bottom+20}" fill="#aaa2c5" font-size="10" text-anchor="middle">${esc(v.label)}</text>${v.count?`<text x="${x+bw/2}" y="${bottom-hh-9}" fill="#e8f4e6" font-size="11" text-anchor="middle">${v.count}</text>`:''}`;}).join('')}</svg>`;}
function lineChart(data){const w=640,h=230,left=40,right=612,top=24,bottom=180;if(!data.length)return '<div class="empty"><strong>No history yet</strong>Log this exercise in a finished workout to see your trend.</div>';const vals=data.map(x=>x.value);let lo=Math.min(...vals),hi=Math.max(...vals);if(lo===hi){lo=Math.max(0,lo-5);hi+=5;}const xy=data.map((d,i)=>({x:data.length===1?(left+right)/2:left+(right-left)*i/(data.length-1),y:bottom-(d.value-lo)/(hi-lo)*(bottom-top)}));const path=xy.map((p,i)=>`${i===0?'M':'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Estimated exercise strength trend">${[0,1,2,3].map(i=>{const y=bottom-(bottom-top)*i/3;return `<line x1="${left}" y1="${y}" x2="${right}" y2="${y}" stroke="#354144" stroke-dasharray="4 5"/><text x="${left-8}" y="${y+4}" text-anchor="end" fill="#96a8a0" font-size="10">${(lo+(hi-lo)*i/3).toFixed(0)}</text>`;}).join('')}<path d="${path}" fill="none" stroke="#a68aff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>${xy.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="5" fill="#a68aff" stroke="#17221c" stroke-width="2"/><text x="${p.x}" y="${p.y-13}" fill="#e6dcff" text-anchor="middle" font-size="10">${data[i].value.toFixed(1)}</text>`).join('')}<text x="${left}" y="${bottom+30}" fill="#91a198" font-size="11">${esc(data[0].label)}</text><text x="${right}" y="${bottom+30}" text-anchor="end" fill="#91a198" font-size="11">${esc(data.at(-1).label)}</text></svg>`;}
function renderProgress(){const s=stats();const base=monday();const weekly=Array.from({length:8},(_,i)=>{const start=dateShift(base,(i-7)*7);const end=dateShift(start,6);return {label:start.toLocaleDateString(undefined,{month:'short',day:'numeric'}),count:state.history.filter(h=>h.date>=localDate(start)&&h.date<=localDate(end)).length};});const available=new Map();state.plan.forEach(p=>p.exercises.forEach(ex=>available.set(ex.id,ex.name)));state.history.forEach(h=>h.sets.forEach(s=>available.set(s.exerciseId,s.name)));const opts=Array.from(available.entries()).sort((a,b)=>a[1].localeCompare(b[1]));if(!available.has(ui.trendExercise))ui.trendExercise=opts[0]?.[0]||'';const trend=state.history.map(h=>{const group=h.sets.filter(s=>s.exerciseId===ui.trendExercise && s.type==='working' && s.unit!=='sec' && num(s.weight)>0 && num(s.reps)>0 && num(s.reps)<=10);if(!group.length)return null;return {label:datePrettyKey(h.date),value:Math.max(...group.map(s=>num(s.weight)*(1+num(s.reps)/30)))};}).filter(Boolean).slice(-12);
const byGroup={};state.history.forEach(h=>{if(!isInWeek(h.date))return;h.sets.forEach(s=>{if(s.type==='warmup')return;byGroup[s.group]=(byGroup[s.group]||0)+1;});});const maxSets=Math.max(1,...Object.values(byGroup));
return `${head('TRAINING ANALYTICS','Progress that you can see.','Your workout logs power these charts. No remote service receives the data.')}<div class="grid four-col" style="margin-bottom:16px"><div class="panel stat"><div class="stat-title">ALL WORKOUTS</div><div class="stat-value">${s.total}</div><div class="stat-foot">Completed sessions</div></div><div class="panel stat"><div class="stat-title">THIS WEEK</div><div class="stat-value">${s.week} <span class="muted">/ 6</span></div><div class="stat-foot">Sessions logged</div></div><div class="panel stat"><div class="stat-title">WORKING SETS</div><div class="stat-value">${s.allSets}</div><div class="stat-foot">Including drop sets</div></div><div class="panel stat"><div class="stat-title">TOTAL VOLUME</div><div class="stat-value">${displayVolume(s.volume)}</div><div class="stat-foot">${weightUnit()} × reps (not bodyweight)</div></div></div><div class="grid two-col"><div><div class="panel"><div class="panel-header"><div><h3>Workout consistency</h3><p>Completed sessions per week · last 8 weeks</p></div></div>${barChart(weekly)}</div><div class="panel" style="margin-top:16px"><div class="panel-header"><div><h3>Exercise strength trend</h3><p>Estimated 1RM = load × (1 + reps / 30)</p></div></div><select aria-label="Choose an exercise for strength chart" data-action="trend-exercise" style="width:100%;margin-bottom:14px">${opts.map(([id,name])=>`<option value="${esc(id)}" ${id===ui.trendExercise?'selected':''}>${esc(name)}</option>`).join('')}</select>${lineChart(trend)}<p class="muted-note">Estimated 1RM is only a rough trend, especially for machines and isolation movements. Never attempt a true 1-rep max to fill this chart.</p></div></div><div><div class="panel"><div class="panel-header"><div><h3>Weekly sets by muscle focus</h3><p>Direct working sets, not indirect overlap</p></div></div>${Object.keys(byGroup).length?Object.entries(byGroup).sort((a,b)=>b[1]-a[1]).map(([name,value])=>`<div class="volume-row"><strong style="min-width:78px">${esc(name)}</strong><div class="meter"><div style="width:${value/maxSets*100}%"></div></div><strong>${value}</strong></div>`).join(''):'<div class="empty">Complete your first session to see weekly muscle-group coverage.</div>'}<p class="muted-note">Compound lifts also train other muscles; these categories are simplified for tracking.</p></div><div class="panel" style="margin-top:16px"><div class="panel-header"><div><h3>Workout history</h3><p>${state.history.length} finished sessions</p></div></div>${state.history.length?state.history.slice().reverse().map(h=>{const volume=Math.round(h.sets.reduce((n,s)=>n+(s.type==='warmup'?0:num(s.weight)*num(s.reps)),0));return `<details class="history-item"><summary><div><strong>${esc(h.name)}</strong><small>${esc(datePrettyKey(h.date))} · ${h.sets.filter(s=>s.type!=='warmup').length} sets · ${Math.round((h.durationSec||0)/60)} min</small></div><span class="pill">${volume.toLocaleString()} kg</span></summary><div class="history-rows">${h.sets.map(s=>`<div><span>${esc(s.name)} <span class="muted">(${esc(s.type||'working')})</span></span><strong>${num(s.weight)} kg × ${num(s.reps)} ${s.unit==='sec'?'sec':'reps'} · ${num(s.rir,2)} RIR</strong></div>`).join('')}</div>${h.notes?`<p class="muted small">Notes: ${esc(h.notes)}</p>`:''}<div class="btn-row" style="margin-top:10px"><button class="btn danger small" data-action="delete-history" data-history="${esc(h.id)}">Delete workout</button></div></details>`;}).join(''):'<div class="empty"><strong>Nothing logged yet</strong>Start a workout and complete a set, then finish your session. It will appear here.</div>'}</div></div></div>`;}
function renderSettings(){return `${head('YOUR DATA','Make the tracker yours.','No login. No subscription. Your history is stored in this browser.')}<div class="grid two-col"><div><div class="panel setting-section"><div class="setting-title"><div><h3>Keep your workout history safe</h3><p>Export and restore your entire plan, logs and preferences</p></div>${pill('Offline','green')}</div><div class="btn-row"><button class="btn" data-action="export-data">↓ Export JSON backup</button><button class="btn secondary" data-action="export-csv">↓ Export sets (CSV)</button><button class="btn secondary" data-action="import-data">↑ Restore backup</button></div><p class="muted-note">Backup files are saved to your downloads. Restoring replaces all current data. Store a copy in your phone files or personal cloud drive.</p></div><div class="panel setting-section"><div class="setting-title"><div><h3>Install as a phone app</h3><p>Works from your home screen when hosted on HTTPS</p></div></div><div class="btn-row"><button class="btn secondary" data-action="install-pwa" id="installBtn">↗ Install FitTrack</button></div><p class="muted-note">Android Chrome: open the hosted website → menu (⋮) → Add to Home screen / Install app. iPhone Safari: Share → Add to Home Screen. Installation options depend on browser and hosting.</p></div><div class="panel setting-section"><div class="setting-title"><div><h3>Browser storage</h3><p id="storageStatus">${ui.storageMode==='indexeddb'?'IndexedDB ready — private to this browser origin':ui.storageMode==='localStorage'?'Using basic browser storage':'Storage unavailable — export data now'}</p></div><button class="btn secondary" data-action="persistent-storage">Request durable storage</button><p class="muted-note">Browsers may still delete site data, and changing browsers/devices does not transfer workouts. Export backups regularly.</p></div></div><div><div class="panel setting-section"><div class="setting-title"><div><h3>Workout preferences</h3><p>Customize your logging experience</p></div></div><label class="field"><span class="setting-label">Weight unit</span><select id="weightUnitSelect" data-action="setting-weight-unit" aria-label="Preferred weight unit"><option value="kg" ${weightUnit()==='kg'?'selected':''}>Kilograms (kg)</option><option value="lb" ${weightUnit()==='lb'?'selected':''}>Pounds (lb)</option></select></label><p class="muted-note">Only the display changes. Data is stored in kilograms, so switching units never rewrites your workout history.</p><div class="setting-title"><div></div></div><label class="checkbox-row"><input type="checkbox" data-action="setting-rest" ${state.settings.autoRest?'checked':''}/><span>Start rest timer automatically after each completed set</span></label><p class="muted-note">The timer uses the rest time saved with each exercise. You can extend or dismiss it at any time.</p></div><div class="panel setting-section"><div class="setting-title"><div><h3>Training reminder</h3><p>Protect your recovered lower back</p></div></div><ul class="help-list"><li>Return to leg training gradually with a comfortable depth and controlled loads.</li><li>Rest and recovery matter more than doing extra sets just to feel exhausted.</li><li>Persistent or recurring back pain deserves evaluation by a qualified clinician.</li><li>If you have sudden weakness, saddle numbness or bowel/bladder changes, seek urgent care.</li></ul></div><div class="panel setting-section"><div class="setting-title"><div><h3>Reset everything</h3><p>Remove all workouts, history and settings from this browser</p></div></div><button class="btn danger" data-action="reset-data">Erase my local data</button></div></div></div><p class="footline">FitTrack v1.0 • Local-first PWA • No trackers or cloud sync. If you use private browsing, local data may be cleared when the session ends.</p>`;}
function modalOpen(html){$('#modalBody').innerHTML=html;$('#modal').showModal();}
function modalClose(){$('#modal').close();}
function exerciseModal(index=null){const p=getPlan(ui.selectedPlan);if(!p)return;const editing=index!==null;const ex=editing?p.exercises[index]:E('','Back',3,8,12,90,'');if(!ex)return;const groups=['Chest','Back','Triceps','Biceps','Forearms','Quads','Hamstrings','Glutes','Adductors','Calves','Shoulders','Traps','Core','Other'];modalOpen(`<div class="eyebrow">${editing?'EDIT EXERCISE':'NEW EXERCISE'}</div><h2>${editing?'Update your movement':'Add to '+esc(p.short)}</h2><p>Changes to your program affect future sessions only.</p><form id="exerciseForm" data-index="${editing?index:''}"><div class="field"><label for="exName">Exercise name</label><input id="exName" name="name" maxlength="90" value="${esc(ex.name)}" required/></div><div class="fields-row"><div class="field"><label for="exGroup">Muscle group</label><select name="group" id="exGroup">${groups.map(g=>`<option value="${g}" ${g===ex.group?'selected':''}>${g}</option>`).join('')}</select></div><div class="field"><label for="exSets">Working sets</label><input id="exSets" type="number" name="sets" min="1" max="12" value="${num(ex.sets)}" required/></div></div><div class="fields-row"><div class="field"><label for="exMin">Minimum reps / seconds</label><input id="exMin" type="number" name="min" min="1" max="300" value="${num(ex.min)}" required/></div><div class="field"><label for="exMax">Maximum reps / seconds</label><input id="exMax" type="number" name="max" min="1" max="300" value="${num(ex.max)}" required/></div></div><div class="fields-row"><div class="field"><label for="exRest">Rest seconds</label><input id="exRest" type="number" name="rest" min="0" max="600" step="5" value="${num(ex.rest)}" required/></div><div class="field"><label for="exUnit">Reps or seconds</label><select id="exUnit" name="unit"><option value="reps" ${ex.unit==='reps'?'selected':''}>Repetitions</option><option value="sec" ${ex.unit==='sec'?'selected':''}>Seconds</option></select></div></div><div class="field"><label for="exNotes">Technique cues (optional)</label><textarea name="notes" id="exNotes" maxlength="350">${esc(ex.notes||'')}</textarea></div><label class="checkbox-row"><input type="checkbox" name="optional" ${ex.optional?'checked':''}/><span>Optional exercise (does not count as a required set)</span></label><div class="modal-footer"><button type="button" class="btn ghost" data-action="close-modal">Cancel</button><button type="submit" class="btn">${editing?'Save changes':'Add exercise'}</button></div></form>`);$('#exName').focus();}
function saveExerciseForm(form){const p=getPlan(ui.selectedPlan);if(!p)return;const f=new FormData(form);const name=String(f.get('name')||'').trim();const min=num(f.get('min')),max=num(f.get('max')),sets=num(f.get('sets')),rest=num(f.get('rest'));if(!name||name.length>90||min<1||max<min||sets<1||sets>12||rest<0||rest>600){toast('Please check the name, sets and rep range.',true);return;}const idx=form.dataset.index!==''?Number(form.dataset.index):null;const original=idx===null?null:p.exercises[idx];const ex={id:original?.id||slug(name)||uid(),name,group:String(f.get('group')),sets,min,max,rest,notes:String(f.get('notes')||''),unit:f.get('unit')==='sec'?'sec':'reps',optional:f.has('optional')};if(idx===null)p.exercises.push(ex);else p.exercises[idx]=ex;queueSave();modalClose();render();toast(idx===null?'Exercise added to your plan.':'Exercise updated.');}
function csvCell(x){const text=String(x??'');const safe=/^[=+@\t\r]/.test(text)?"'"+text:text;return '"'+safe.replace(/"/g,'""')+'"';}
function exportCSV(){const headings=['date','workout','exercise','muscle','set_type','weight_kg','reps_or_seconds','unit','RIR','completed_at','session_notes'];const rows=[headings];for(const h of state.history){for(const set of h.sets||[]){rows.push([h.date,h.name,set.name,set.group,set.type,set.weight,set.reps,set.unit||'reps',set.rir,set.completedAt||'',h.notes||'']);}}
 const text=rows.map(row=>row.map(csvCell).join(',')).join('\r\n');const blob=new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='fittrack-sets-'+localDate()+'.csv';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Workout CSV export started. Weights exported in kilograms.');}
function exportBackup(){const backup={...state,exportedAt:new Date().toISOString(),app:'FitTrack v1'};const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`fittrack-backup-${localDate()}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('JSON backup download started.');}
async function importBackup(file){if(!file)return;try{if(file.size>20*1024*1024)throw new Error('Backup file is too large');const content=await file.text();const parsed=JSON.parse(content);const validated=validateState(parsed);if(!confirm(`Restore backup containing ${validated.history.length} completed workouts? This replaces your current plans, draft, and history.`))return;state=validated;ui.selectedPlan=state.plan[0]?.id||'push-a';await immediateSave();go('home');toast('Workout history and plan restored.');}catch(e){console.error(e);toast('Backup could not be restored. Check that it is a FitTrack JSON file.',true);}finally{$('#restoreFile').value='';}}
function resetApp(){if(!confirm('This will permanently erase your local workout history, plans and active session. Have you exported a backup?'))return;if(!confirm('Confirm again: erase all local FitTrack data?'))return;state=emptyState();ui.selectedPlan='push-a';stopRest();immediateSave();go('home');toast('Local FitTrack data reset.');}
async function durableStorage(){try{if(!navigator.storage?.persist){toast('Persistent storage is unavailable in this browser.',true);return;}const granted=await navigator.storage.persist();toast(granted?'Persistent storage granted on this browser.':'Browser did not grant persistence. Keep exporting backups.',!granted);}catch{toast('Persistent storage could not be requested.',true);}}
function installApp(){if(ui.installPrompt){const p=ui.installPrompt;ui.installPrompt=null;p.prompt();p.userChoice.then(c=>toast(c.outcome==='accepted'?'Install accepted!':'Use your browser menu to install later.'));return;}modalOpen(`<h2>Add FitTrack to your phone</h2><p>To install and get reliable offline use, first host this folder as an HTTPS website (for example via GitHub Pages).</p><div class="alert"><strong>Android Chrome:</strong> open your hosted URL → ⋮ menu → Install app or Add to Home screen.</div><div class="alert"><strong>iPhone Safari:</strong> open your hosted URL → Share → Add to Home Screen.</div><p>Opening an HTML file directly from Downloads is useful for a preview, but app installation and storage may not work reliably that way.</p><div class="modal-footer"><button class="btn" data-action="close-modal">Got it</button></div>`);}
function toggleArrayValue(obj,key,item,checked){const a=Array.isArray(obj[key])?obj[key]:[];obj[key]=checked?Array.from(new Set([...a,item])):a.filter(x=>x!==item);queueSave();render();}
function act(button){const action=button.dataset.action;const exIndex=Number(button.dataset.ex),setIndex=Number(button.dataset.set);switch(action){
  case 'open-media':{ui.mediaStage=button.dataset.stage||'warmup';ui.mediaType=button.dataset.type||getPlan(ui.selectedPlan)?.type||'push';ui.activeVideo='';go('media');return;}
  case 'media-stage':ui.mediaStage=button.dataset.stage||'warmup';ui.activeVideo='';render();return;
  case 'media-type':ui.mediaType=button.dataset.type||'push';ui.activeVideo='';render();return;
  case 'play-media':ui.activeVideo=ui.activeVideo===button.dataset.key?'':button.dataset.key;render();return;
  case 'save-media-custom':{const value=($('#personal-video-input')?.value||'').trim();const key=button.dataset.key;try{const u=new URL(value);if(u.protocol!=='https:' || !['youtube.com','www.youtube.com','youtu.be','vimeo.com','www.vimeo.com'].includes(u.hostname.toLowerCase()))throw Error('Only YouTube or Vimeo HTTPS links');if(!embedUrl(u.href))throw Error('Unrecognized video address');state.videoLinks=state.videoLinks||{};state.videoLinks[key]=u.href;ui.activeVideo=key;queueSave();render();toast('Personal video saved on this device.');}catch{toast('Use a valid HTTPS YouTube or Vimeo video URL.',true);}return;}
  case 'clear-media-custom':{if(state.videoLinks)delete state.videoLinks[button.dataset.key];ui.activeVideo='';queueSave();render();toast('Personal video removed.');return;}
  case 'save-video-link':{const value=($('#customVideoUrl')?.value||'').trim();if(!value){toast('Paste a video URL to save it.',true);return;}try{const u=new URL(value);if(!safeExerciseVideo(u.href)||!embedUrl(u.href))throw Error('Use a supported video URL');state.videoLinks=state.videoLinks||{};state.videoLinks[ui.guideId]=u.href;ui.activeVideo=ui.guideId;queueSave();render();toast('Technique video link saved.');}catch{toast('Enter a valid https:// video link.',true);}return;}
  case 'clear-video-link':{if(state.videoLinks)delete state.videoLinks[ui.guideId];queueSave();render();toast('Saved video link removed.');return;}
  case 'show-reference-media':{state.mediaOverrides=state.mediaOverrides||{};state.mediaOverrides[button.dataset.guide]=true;delete state.mediaOverrides['hidden:'+button.dataset.guide];queueSave();render();return;}
 case 'hide-reference-media':{state.mediaOverrides=state.mediaOverrides||{};state.mediaOverrides[button.dataset.guide]=false;state.mediaOverrides['hidden:'+button.dataset.guide]=true;queueSave();render();return;}
 case 'open-guide':goGuide(button.dataset.guide,ui.view);return;
  case 'return-guide':guideReturn();return;
  case 'go-active-exercise':ui.guideId=button.dataset.guide;guideReturn();return;
  case 'guide-filter':ui.libraryGroup=button.dataset.group||'All';render();return;
  case 'choose-week-day':{const id=calendarMap[Number(button.dataset.day)];if(!id){go('home');setTimeout(()=>$('#mobilityAnchor')?.scrollIntoView({behavior:'smooth'}),100);return;}ui.selectedPlan=id;go('plan');return;}
  case 'scroll-mobility':$('#mobilityAnchor')?.scrollIntoView({behavior:'smooth'});return;
  case 'choose-plan':ui.selectedPlan=button.dataset.plan;go('plan');return;
  case 'preview-today':ui.selectedPlan=todayPlan()||'push-a';go('plan');return;
  case 'start-workout':startWorkout(button.dataset.plan);return;
  case 'toggle-set':setDone(exIndex,setIndex);return;
  case 'cycle-set-type':setType(exIndex,setIndex);return;
  case 'add-set':addSet(exIndex,button.dataset.type);return;
  case 'remove-set':removeSet(exIndex);return;
  case 'finish-workout':finishWorkout();return;
  case 'discard-workout':if(confirm('Discard your unfinished session? It will not appear in history.')){state.draft=null;stopRest();immediateSave();go('home');toast('Session discarded.');}return;
  case 'manual-rest':startRest(num(button.dataset.seconds,90));return;
  case 'stop-rest':stopRest();return;
  case 'add-rest':ui.restEnd+=30000;state.restEndsAt=ui.restEnd;queueSave();renderTimer();return;
  case 'add-exercise':exerciseModal();return;
  case 'edit-exercise':exerciseModal(Number(button.dataset.index));return;
  case 'delete-exercise':{const p=getPlan(ui.selectedPlan);const i=Number(button.dataset.index);if(p&&p.exercises[i]&&confirm(`Remove ${p.exercises[i].name} from this plan? Past logs stay unchanged.`)){p.exercises.splice(i,1);queueSave();render();}return;}
  case 'move-exercise':{const p=getPlan(ui.selectedPlan);const i=Number(button.dataset.index),next=i+Number(button.dataset.dir);if(p && next>=0 && next<p.exercises.length){[p.exercises[i],p.exercises[next]]=[p.exercises[next],p.exercises[i]];queueSave();render();}return;}
  case 'delete-history':{const h=state.history.find(h=>h.id===button.dataset.history);if(h&&confirm(`Delete your completed ${h.name} workout from ${datePrettyKey(h.date)}?`)){state.history=state.history.filter(x=>x.id!==h.id);queueSave();render();toast('Workout deleted.');}return;}
  case 'close-modal':modalClose();return;
  case 'export-data':exportBackup();return;
  case 'export-csv':exportCSV();return;
  case 'import-data':$('#restoreFile').click();return;
  case 'install-pwa':installApp();return;
  case 'persistent-storage':durableStorage();return;
  case 'reset-data':resetApp();return;
}}
function initEvents(){document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){go(nav.dataset.nav);return;}const action=e.target.closest('[data-action]');if(!action||action.matches('input,select,textarea'))return;act(action);});
  document.addEventListener('input',e=>{const el=e.target;if(el.matches('[data-field]')){const s=state.draft?.exercises[Number(el.dataset.ex)]?.sets[Number(el.dataset.set)];if(!s)return;const field=el.dataset.field;s[field]=field==='weight'?weightToKg(el.value):el.value;queueSave();}else if(el.id==='librarySearch'){ui.libraryQuery=el.value;renderLibraryList();}else if(el.id==='sessionNotes'&&state.draft){state.draft.notes=el.value;queueSave();}});
  document.addEventListener('change',e=>{const el=e.target;if(['check-warmup','check-phase'].includes(el.dataset.action)){toggleArrayValue(state.checklists,el.dataset.key,el.dataset.id,el.checked);}else if(el.dataset.action==='check-mobility'){toggleArrayValue(state.mobility,el.dataset.key,el.dataset.id,el.checked);}else if(el.dataset.action==='trend-exercise'){ui.trendExercise=el.value;render();}else if(el.dataset.action==='setting-rest'){state.settings.autoRest=el.checked;queueSave();render();}else if(el.dataset.action==='setting-weight-unit'){state.settings.weightUnit=el.value==='lb'?'lb':'kg';queueSave();render();}else if(el.matches('select[data-field]')){const s=state.draft?.exercises[Number(el.dataset.ex)]?.sets[Number(el.dataset.set)];if(s){s[el.dataset.field]=el.value;queueSave();}}});
  document.addEventListener('toggle',e=>{if(e.target.id==='prepDetails'&&document.contains(e.target))ui.prepOpen=e.target.open;},true);
  document.addEventListener('submit',e=>{if(e.target.id==='exerciseForm'){e.preventDefault();saveExerciseForm(e.target);}});
  $('#restoreFile').addEventListener('change',e=>importBackup(e.target.files?.[0]));
  $('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))modalClose();});
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();ui.installPrompt=e;});
  window.addEventListener('pagehide',()=>{if(ui.saveTimer)persistNow();});
  window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v.startsWith('guide/')){ui.guideId=decodeURIComponent(v.slice(6));ui.view='guide';render();return;}if(['home','session','plan','progress','settings','library','media'].includes(v)){ui.view=v;render();}});
  setInterval(()=>{if(state.draft){const el=$('#elapsedClock');if(el)el.textContent=formatTime((Date.now()-new Date(state.draft.startedAt).getTime())/1000);}},30000);
}
async function boot(){initEvents();try{await loadState();}catch(e){console.error(e);ui.storageMode='memory';}const hash=location.hash.replace('#','');ui.view=hash.startsWith('guide/')?'guide':(['home','session','plan','progress','settings','library','media'].includes(hash)?hash:'home');if(hash.startsWith('guide/'))ui.guideId=decodeURIComponent(hash.slice(6));ui.selectedPlan=state.plan[0]?.id||'push-a';if(state.restEndsAt>Date.now()){ui.restEnd=state.restEndsAt;ui.restInterval=setInterval(renderTimer,1000);}else{state.restEndsAt=0;}render();if('serviceWorker' in navigator&&location.protocol!=='file:'&&location.hostname!==''){navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Offline registration unavailable',err));}if(ui.storageMode==='memory')toast('Browser storage disabled — backup your data.',true);}
boot();
</script></body>
</html>
